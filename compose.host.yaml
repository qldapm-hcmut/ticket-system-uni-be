services:
  migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./db/migrations:/migrations:ro
    command: ["-path", "/migrations", "-database", "${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: .
    environment:
      HTTP_ADDR: ":3000"
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
      AUTH_MODE: ${AUTH_MODE:-local}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      QR_HMAC_SECRET: ${QR_HMAC_SECRET:?Set QR_HMAC_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  worker:
    build: .
    command: ["./worker"]
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:?Set DOCKER_DATABASE_URL in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: ../ticket-system-uni-fe
      args:
        VITE_ENABLE_DEV_LOGIN: ${VITE_ENABLE_DEV_LOGIN:-true}
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "${WEB_BIND_ADDRESS:-0.0.0.0}:${WEB_PORT:-5174}:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/login"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
